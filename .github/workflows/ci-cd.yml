name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci_Passw0rd!
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci_Passw0rd! -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 10 --health-start-period 30s
    defaults:
      run:
        working-directory: BackEnd
    env:
      INTEGRATION_SQL_SERVER: Server=localhost,1433;User Id=sa;Password=Ci_Passw0rd!;TrustServerCertificate=True;Encrypt=False
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: BackEnd/global.json
      - run: dotnet restore PdfShare.sln
      - run: dotnet build PdfShare.sln -c Release --no-restore -warnaserror
      - run: dotnet test PdfShare.sln -c Release --no-build --logger trx --results-directory TestResults
      - name: Vulnerable packages
        run: dotnet list PdfShare.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt && ! grep -q "has the following vulnerable packages" vuln.txt

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  deploy:
    name: Build images & deploy to Container Apps
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write   # OIDC federated login, no client secret in GitHub
      contents: read
    env:
      TAG: ${{ github.sha }}
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR: ${{ vars.AZURE_ACR_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push images (ACR Tasks, no local Docker daemon needed)
        run: |
          az acr build -r "$ACR" -t "pdfshare-api:$TAG" -f BackEnd/PdfShare.API/Dockerfile BackEnd
          az acr build -r "$ACR" -t "pdfshare-func:$TAG" -f BackEnd/PdfShare.Functions/Dockerfile BackEnd
          az acr build -r "$ACR" -t "pdfshare-web:$TAG" -f FrontEnd/Dockerfile FrontEnd
      - name: Deploy (Bicep keeps infra in sync and rolls out the new tag)
        run: |
          az deployment group create -g "$RG" -f deploy/azure/main.bicep \
            -p imageTag="$TAG" jwtSecret="${{ secrets.JWT_SECRET }}"
